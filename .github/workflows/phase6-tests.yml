name: Phase 6 source checks
on:
  push:
    branches: [phase6-agentic-automation]
  pull_request:
    paths:
      - 'backend/app/phase6_agents/**'
      - 'backend/tests/test_phase6_full.py'
      - 'backend/tests/test_phase6_http.py'
      - 'backend/alembic/versions/0006_phase6_agents.py'
      - 'frontend/app/phase6/**'
      - '.github/workflows/phase6-tests.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-phase6.txt
      - name: Compile Phase 6
        run: python -m compileall -q backend/app/phase6_agents backend/alembic/versions/0006_phase6_agents.py
      - name: Run Phase 6 tests
        working-directory: backend
        run: python -m pytest -q tests/test_phase6_full.py tests/test_phase6_http.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
