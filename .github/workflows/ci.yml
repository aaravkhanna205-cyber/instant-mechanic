name: CI (all checks)
# Runs on every push and pull request: backend tests on real PostgreSQL, database migrations,
# frontend type check / lint / build, secret scan, dependency audit and the browser tests.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No passwords, keys or private settings files in the repository
        run: python scripts/secret_scan.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: imhire_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_user -d imhire_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password_only@127.0.0.1:5432/imhire_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3003
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          grep -v sentence-transformers requirements-phase4-complete.txt > /tmp/req-phase4-light.txt  # the large AI model library is not needed for tests
          pip install -r requirements.txt -r requirements-phase3-auth.txt -r requirements-phase3-completion.txt -r /tmp/req-phase4-light.txt -r requirements-phase6.txt
      - name: Database migrations (up, one step down, up again)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic current
      - name: All backend tests
        run: python -m pytest -q
      - name: Phase 7 tests again on PostgreSQL
        run: |
          PGPASSWORD=ci_password_only psql -h 127.0.0.1 -U ci_user -d imhire_ci -c 'CREATE DATABASE imhire_p7'
          PHASE7_TEST_DATABASE_URL=postgresql+psycopg://ci_user:ci_password_only@127.0.0.1:5432/imhire_p7 python -m pytest -q tests/test_phase7_enterprise.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  dependency-audit:
    # Advisory only: shows known security problems in libraries without failing the build.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python libraries
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt -r backend/requirements-phase3-auth.txt -r backend/requirements-phase3-completion.txt -r backend/requirements-phase4-complete.txt -r backend/requirements-phase6.txt || true
      - name: Website libraries
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true

  e2e:
    # The full hiring flow in a real browser against the real API and PostgreSQL.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: imhire_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_user -d imhire_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password_only@127.0.0.1:5432/imhire_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: http://127.0.0.1:3000
      PHASE4_PRIVATE_DIR: /tmp/e2e-uploads
      REQUIRE_RESUME_TO_APPLY: 'YES'
      E2E_SEED: 'YES'
      E2E_PASSWORD: ci_e2e_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          grep -v sentence-transformers requirements-phase4-complete.txt > /tmp/req-phase4-light.txt  # the large AI model library is not needed for tests
          pip install -r requirements.txt -r requirements-phase3-auth.txt -r requirements-phase3-completion.txt -r /tmp/req-phase4-light.txt -r requirements-phase6.txt
          python -m alembic upgrade head
          python -m scripts.e2e_seed
          mkdir -p /tmp/e2e-uploads
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      - name: Build and start the website
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 -H 127.0.0.1 > /tmp/web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
      - name: Browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Logs if something failed
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
